<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTOKI — Sem conexão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: hsl(220, 25%, 5%);
      color: hsl(220, 10%, 85%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 420px; }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, hsl(24, 95%, 53%), hsl(24, 80%, 40%));
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 0 40px hsl(24, 95%, 53%, 0.25);
    }
    .logo svg { width: 36px; height: 36px; stroke: white; fill: none; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: hsla(0, 72%, 51%, 0.15);
      border: 1px solid hsla(0, 72%, 51%, 0.25);
      border-radius: 999px;
      color: hsl(0, 85%, 75%);
      font-size: 0.8rem; font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .dot { width: 8px; height: 8px; background: hsl(0, 72%, 51%); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    .brand { color: hsl(24, 95%, 53%); }
    p { color: hsl(220, 10%, 45%); line-height: 1.7; margin-bottom: 2rem; font-size: 0.95rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px;
      background: hsl(24, 95%, 53%);
      color: white; border: none; border-radius: 14px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px hsl(24, 95%, 53%, 0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px hsl(24, 95%, 53%, 0.4); }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 18px; height: 18px; }
    .tips {
      margin-top: 2.5rem; padding: 1.25rem;
      background: hsla(220, 25%, 10%, 0.6);
      border: 1px solid hsl(220, 20%, 14%);
      border-radius: 14px; text-align: left;
    }
    .tips h3 { font-size: 0.7rem; color: hsl(24, 95%, 53%); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
    .tips ul { list-style: none; }
    .tips li { padding: 6px 0; color: hsl(220, 10%, 45%); font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
    .tips li::before { content: "→"; color: hsl(24, 95%, 53%); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        <path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
      </svg>
    </div>
    <div class="status"><span class="dot"></span>Sem conexão</div>
    <h1>Você está <span class="brand">offline</span></h1>
    <p>Não foi possível conectar ao ESTOKI. Verifique sua internet e tente novamente.</p>
    <button class="btn" onclick="location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
      </svg>
      Tentar novamente
    </button>
    <div class="tips">
      <h3>Dicas</h3>
      <ul>
        <li>Verifique se Wi-Fi ou dados móveis estão ligados</li>
        <li>Reinicie o roteador se necessário</li>
        <li>Aguarde alguns instantes e tente novamente</li>
      </ul>
    </div>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
