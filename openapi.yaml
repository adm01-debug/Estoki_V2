openapi: 3.1.0
info:
  title: ESTOKI WMS API
  description: API completa para o Sistema de Gestão de Armazéns ESTOKI
  version: 1.0.0
  contact:
    name: ESTOKI Support
    email: suporte@estoki.com.br
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.estoki.com.br/v1
    description: Production
  - url: https://staging-api.estoki.com.br/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Development

tags:
  - name: Auth
    description: Autenticação e autorização
  - name: Users
    description: Gestão de usuários
  - name: Products
    description: Gestão de produtos
  - name: Inventory
    description: Gestão de estoque
  - name: Orders
    description: Gestão de pedidos
  - name: Receiving
    description: Recebimento de mercadorias
  - name: Picking
    description: Separação de pedidos
  - name: Packing
    description: Embalagem de pedidos
  - name: Shipping
    description: Expedição e envio
  - name: Warehouses
    description: Gestão de armazéns
  - name: Locations
    description: Gestão de localizações
  - name: Suppliers
    description: Gestão de fornecedores
  - name: Customers
    description: Gestão de clientes
  - name: Carriers
    description: Gestão de transportadoras
  - name: Reports
    description: Relatórios e analytics

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout de usuário
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout bem-sucedido

  /users:
    get:
      tags: [Users]
      summary: Lista usuários
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
    post:
      tags: [Users]
      summary: Cria usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /products:
    get:
      tags: [Products]
      summary: Lista produtos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
    post:
      tags: [Products]
      summary: Cria produto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{id}:
    get:
      tags: [Products]
      summary: Busca produto por ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Atualiza produto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      tags: [Products]
      summary: Remove produto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Produto removido

  /inventory:
    get:
      tags: [Inventory]
      summary: Lista estoque
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: warehouse_id
          in: query
          schema:
            type: string
            format: uuid
        - name: product_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventory'

  /inventory/adjust:
    post:
      tags: [Inventory]
      summary: Ajusta estoque
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjust'
      responses:
        '200':
          description: Ajuste realizado

  /orders:
    get:
      tags: [Orders]
      summary: Lista pedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, picking, packing, shipped, delivered, cancelled]
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
    post:
      tags: [Orders]
      summary: Cria pedido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Pedido criado

  /receiving:
    get:
      tags: [Receiving]
      summary: Lista recebimentos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de recebimentos
    post:
      tags: [Receiving]
      summary: Cria recebimento
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Recebimento criado

  /picking:
    get:
      tags: [Picking]
      summary: Lista separações
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de separações

  /waves:
    get:
      tags: [Picking]
      summary: Lista ondas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de ondas
    post:
      tags: [Picking]
      summary: Cria onda
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Onda criada

  /packing:
    get:
      tags: [Packing]
      summary: Lista embalagens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de embalagens

  /shipments:
    get:
      tags: [Shipping]
      summary: Lista expedições
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de expedições

  /warehouses:
    get:
      tags: [Warehouses]
      summary: Lista armazéns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de armazéns
    post:
      tags: [Warehouses]
      summary: Cria armazém
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Armazém criado

  /locations:
    get:
      tags: [Locations]
      summary: Lista localizações
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de localizações

  /suppliers:
    get:
      tags: [Suppliers]
      summary: Lista fornecedores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de fornecedores

  /customers:
    get:
      tags: [Customers]
      summary: Lista clientes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes

  /carriers:
    get:
      tags: [Carriers]
      summary: Lista transportadoras
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de transportadoras

  /reports/inventory:
    get:
      tags: [Reports]
      summary: Relatório de estoque
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Relatório gerado

  /reports/movements:
    get:
      tags: [Reports]
      summary: Relatório de movimentações
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Relatório gerado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchParam:
      name: search
      in: query
      schema:
        type: string

  responses:
    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ValidationError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, operator, viewer]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, operator, viewer]

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        unit:
          type: string
        cost_price:
          type: number
        sale_price:
          type: number
        min_stock:
          type: integer
        is_active:
          type: boolean

    ProductCreate:
      type: object
      required: [sku, name, unit]
      properties:
        sku:
          type: string
        name:
          type: string
        unit:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string

    InventoryAdjust:
      type: object
      required: [product_id, warehouse_id, location_id, adjustment_type, quantity, reason]
      properties:
        product_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        adjustment_type:
          type: string
          enum: [increase, decrease, set]
        quantity:
          type: integer
        reason:
          type: string
          enum: [count, damage, expiration, return, correction, other]

    OrderCreate:
      type: object
      required: [customer_id, warehouse_id, items]
      properties:
        customer_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PaginatedInventory:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        total:
          type: integer

    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        total:
          type: integer
