name: Generate Audit Report PDF

on:
  push:
    paths:
      - 'docs/audit/audit_report.md'
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install jspdf
      - name: Generate PDF
        run: node scripts/generate-audit-pdf.js
      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/audit/audit_report.pdf
          git commit -m "docs: auto-generate audit report PDF [skip ci]" || echo "No changes to commit"
          git push
