# docs:
#   gatilho: workflow_dispatch apenas; `aplicar` exige confirmacao explicita = IMPLANTAR.
#   pre-requisito: a PR que versiona o contrato `verify_jwt = false` das 13 edges em
#     supabase/config.toml precisa estar na main; e ela que impede o deploy de virar JWT obrigatorio.
#   faz, nesta ordem: (1) gera o segredo dos crons e grava no ambiente do projeto (CRON_SECRET),
#     (2) deploya reorder-check, stock-alert e alert-expiration com a guarda (que aceita esse
#     segredo pelo header `x-cron-secret`), (3) grava o mesmo valor no Vault, (4) aplica a migration
#     20261126120000_SEC_cron-header-x-cron-secret.sql (crons passam a mandar o header),
#     (5) prova que a chave publica recebe 401 e que o caminho do cron responde 200.
#   prova (o job falha se nao bater): 401 {"error":"sessao obrigatoria"} para a chave publica nas 3;
#     3 respostas 200 novas em net._http_response pelo header da Vault; 3 jobs em cron.job com o header.
#   por que header e nao Bearer: medido em 25/11/2026 (runs 45629484550 e 45641665541), o Bearer de
#     API key (anon, service_role e as duas do formato novo) nao chega ao codigo como
#     SUPABASE_SERVICE_ROLE_KEY da funcao: as 4 chaves deram 401 na guarda. Header proprio nao sofre isso.
#   rollback: artefato rollback-edges-cron-<sha> guarda o index.ts anterior das 3 e a definicao
#     anterior dos jobs; para voltar, reponha o arquivo em uma branch fix: e rode de novo.
#   falha: sem token, Migration recusada pelo banco, deploy recusado pela API, funcao que nao
#     responda a guarda ou cron que nao responda.
# nao-e-bug:
#   - sem-token: avisa e sai verde sem tocar no projeto oficial
#   - verify_jwt: nao e a defesa (a chave publica passa por ele); a defesa e a guarda no codigo
name: Guarda das edges de cron

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "escreva IMPLANTAR para autorizar Vault, crons e deploy no projeto oficial"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: edges-guarda-cron
  cancel-in-progress: false

jobs:
  guarda:
    name: Guarda e prova das 3 edges de cron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REF: ookjbflsnoefnsixrspc
      ALVO_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
      CHAVE_PUBLICA: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}
      FUNCOES: reorder-check stock-alert alert-expiration
      MIGRATION: supabase/migrations/20261126120000_SEC_cron-header-x-cron-secret.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Conferir autorizacao
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::sem SUPABASE_MANAGEMENT_TOKEN/SUPABASE_ACCESS_TOKEN: nada foi lido nem aplicado."
            echo "SEM_TOKEN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${CONFIRMACAO}" != "IMPLANTAR" ]; then
            echo "::error::Vault, crons e deploy no projeto oficial exigem confirmacao = IMPLANTAR"
            exit 1
          fi
          for s in $FUNCOES; do
            if [ ! -f "supabase/functions/$s/index.ts" ]; then
              echo "::error::sem fonte local para $s"
              exit 1
            fi
          done
          if [ ! -f "$MIGRATION" ]; then
            echo "::error::migration $MIGRATION ausente"
            exit 1
          fi
          if ! grep -q "verify_jwt = false" supabase/config.toml; then
            echo "::error::supabase/config.toml sem o contrato verify_jwt = false: merge a PR do contrato antes"
            exit 1
          fi
      - name: Guardar o que existe hoje (rollback)
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          mkdir -p rollback
          API="https://api.supabase.com/v1/projects/$REF"
          jq -n --arg q "select jobname, schedule, command from cron.job where jobname in ('reorder-check-daily','stock-alert-daily','alert-expiration-daily')" '{query:$q}' > /tmp/q.json
          if curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @/tmp/q.json "$API/database/query" -o rollback/crons-antes.json; then
            echo "crons anteriores salvos ($(wc -c < rollback/crons-antes.json) bytes)"
          else
            rm -f rollback/crons-antes.json
            echo "::warning::nao foi possivel salvar os crons anteriores"
          fi
          for s in $FUNCOES; do
            if curl -sS -f -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/functions/$s/body" -o "rollback/$s.ts"; then
              echo "backup: $s ($(wc -c < "rollback/$s.ts") bytes)"
            else
              rm -f "rollback/$s.ts"
              echo "::warning::sem corpo salvo de $s"
            fi
          done
      - name: Guardar artefato de rollback
        if: env.SEM_TOKEN != '1'
        uses: actions/upload-artifact@v7
        with:
          name: rollback-edges-cron-${{ github.sha }}
          path: rollback
          retention-days: 30
          if-no-files-found: warn
      - name: Gerar o segredo dos crons e gravar no ambiente das funcoes
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$REF"
          SEGREDO="${CRON_SECRET:-}"
          if [ -z "$SEGREDO" ]; then SEGREDO=$(openssl rand -hex 32); fi
          echo "::add-mask::$SEGREDO"
          echo "CRON_SECRET=$SEGREDO" >> "$GITHUB_ENV"
          jq -n --arg v "$SEGREDO" '[{name:"CRON_SECRET", value:$v}]' > /tmp/sec.json
          curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @/tmp/sec.json "$API/secrets" > /dev/null
          echo "CRON_SECRET gravado no ambiente do projeto"
      - name: Deploy das 3 edges
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          for s in $FUNCOES; do
            echo "== $s"
            npx --yes supabase@3.1.0 functions deploy "$s" --project-ref "$REF" --use-api --yes
          done
      - name: Guardar o segredo dos crons no Vault
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$REF"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET nao chegou ao ambiente do job"
            exit 1
          fi
          Q="begin; delete from vault.secrets where name = 'cron_secret'; select vault.create_secret('${CRON_SECRET}', 'cron_secret', 'segredo do header x-cron-secret: autentica os crons das edges de guarda'); commit;"
          jq -n --arg q "$Q" '{query:$q}' > /tmp/vault.json
          curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @/tmp/vault.json "$API/database/query" > /dev/null
          echo "cron_secret gravado no Vault"
      - name: Aplicar a migration dos crons
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$REF"
          jq -Rs '{query: .}' "$MIGRATION" > /tmp/mig.json
          curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @/tmp/mig.json "$API/database/query"
          jq -n --arg q "select count(*) as jobs_com_credencial from cron.job where jobname in ('reorder-check-daily','stock-alert-daily','alert-expiration-daily') and command like '%x-cron-secret%'" '{query:$q}' > /tmp/v.json
          JOBS=$(curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @/tmp/v.json "$API/database/query")
          echo "jobs com o header do cron: $JOBS"
          if [ "$(echo "$JOBS" | jq -r '.[0].jobs_com_credencial')" != "$(echo "$FUNCOES" | wc -w)" ]; then
            echo "::error::nem todos os jobs dos crons ficaram com x-cron-secret: $JOBS"
            exit 1
          fi
      - name: Provar que a chave publica nao executa
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          falhou=0
          for s in $FUNCOES; do
            corpo=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$ALVO_URL/functions/v1/$s" -H "Authorization: Bearer $CHAVE_PUBLICA" -H "Content-Type: application/json" -d '{}')
            echo "$s -> HTTP $corpo | $(head -c 120 /tmp/resp.json)"
            if [ "$corpo" != "401" ] || ! grep -q "sessao obrigatoria" /tmp/resp.json; then
              echo "::error::$s ainda executavel com a chave publica"
              falhou=1
            fi
          done
          exit $falhou
      - name: Provar que o cron continua entrando
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$REF"
          consulta() {
            jq -n --arg q "$1" '{query:$q}' > /tmp/q.json
            curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @/tmp/q.json "$API/database/query"
          }
          MARCO=$(consulta "select coalesce(max(id),0) as marco from net._http_response" | jq -r '.[0].marco')
          echo "marco de respostas anteriores: $MARCO"
          for s in $FUNCOES; do
            consulta "select net.http_post(url := '${ALVO_URL}/functions/v1/${s}', headers := jsonb_build_object('Content-Type','application/json','x-cron-secret', (select decrypted_secret from vault.decrypted_secrets where name = 'cron_secret')), body := '{}');" > /dev/null
          done
          sleep 10
          SAIDA=$(consulta "select status_code, count(*) as respostas from net._http_response where id > ${MARCO} group by 1 order by 1")
          echo "respostas novas do cron: $SAIDA"
          if [ "$(echo "$SAIDA" | jq -r 'length')" != "1" ] ||
             [ "$(echo "$SAIDA" | jq -r '.[0].status_code')" != "200" ] ||
             [ "$(echo "$SAIDA" | jq -r '.[0].respostas')" != "$(echo "$FUNCOES" | wc -w)" ]; then
            echo "::error::o caminho do cron nao respondeu 200 nas 3 edges: $SAIDA"
            exit 1
          fi
          echo "cron autenticado: $(echo "$FUNCOES" | wc -w) respostas 200"
