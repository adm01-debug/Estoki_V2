# docs:
#   gatilho: manual (workflow_dispatch) - nunca push, nunca cron
#   prova: estado real de producao em leitura: refs dos secrets, superficie publica (anon) das RPCs,
#          catalogo/grants/RLS do banco, login real e dry-run de migration com ROLLBACK
#   falha: guard do dry-run barra arquivo com COMMIT/ROLLBACK/END; probe com erro de rede falha o job
#   avisa: job summary repete a saida de cada probe (o log nao e apagado)
# nao-e-bug:
#   - sem-secret-db: sem SUPABASE_MANAGEMENT_TOKEN o probe de banco e pulado com warning
#   - sem-secret-e2e: sem E2E_USER_EMAIL/E2E_USER_PASSWORD o probe de login e pulado com warning
#   - sem-migration: alvo=todos sem `migration` nao faz dry-run (o script exige o arquivo)
name: Diagnostico de producao (somente leitura)

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: O que provar
        type: choice
        default: todos
        options:
          - todos
          - refs
          - anon
          - db
          - auth
          - migracao
      migration:
        description: Caminho da migration para o dry-run (ex. supabase/migrations/2026...sql)
        type: string
        default: ""

concurrency:
  group: diag-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  SB_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
  SB_ANON: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  refs:
    name: Refs dos secrets
    if: github.event.inputs.alvo == 'todos' || github.event.inputs.alvo == 'refs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: A que projeto cada secret aponta
        env:
          S_URL: ${{ vars.SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
          S_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}
          V_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
          V_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}
          V_PID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'ookjbflsnoefnsixrspc' }}
        run: bash scripts/diag/probe-refs.sh

  anon:
    name: Superficie publica (anon)
    if: github.event.inputs.alvo == 'todos' || github.event.inputs.alvo == 'anon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: RPCs executaveis so com a chave publica
        run: bash scripts/diag/probe-anon.sh

  db:
    name: Catalogo, grants e RLS
    if: github.event.inputs.alvo == 'todos' || github.event.inputs.alvo == 'db'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Estado real do banco (leitura)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: bash scripts/diag/probe-db.sh
      - name: Sem token de Management API
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: 'echo "::warning::sem SUPABASE_MANAGEMENT_TOKEN/SUPABASE_ACCESS_TOKEN: nada foi lido."'

  auth:
    name: Login real e leitura autenticada
    if: github.event.inputs.alvo == 'todos' || github.event.inputs.alvo == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EU: ${{ secrets.E2E_USER_EMAIL }}
      EP: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Login e RPCs com JWT de usuario
        if: env.EU != '' && env.EP != ''
        run: bash scripts/diag/probe-auth.sh
      - name: Sem usuario de teste
        if: env.EU == '' || env.EP == ''
        run: 'echo "::warning::sem E2E_USER_EMAIL/E2E_USER_PASSWORD: o login real nao foi exercitado."'

  migracao:
    name: Dry-run de migration (ROLLBACK)
    if: (github.event.inputs.alvo == 'todos' || github.event.inputs.alvo == 'migracao') && github.event.inputs.migration != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      MIG: ${{ github.event.inputs.migration }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Dry-run (aplica, confere e desfaz)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: bash scripts/diag/dryrun-migration.sh "$MIG"
      - name: Sem token de Management API
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: 'echo "::warning::sem SUPABASE_MANAGEMENT_TOKEN/SUPABASE_ACCESS_TOKEN: nada foi aplicado."'