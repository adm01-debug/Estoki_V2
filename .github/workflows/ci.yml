name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # Pin explícito: o npm que acompanha o node-version acima tem um bug conhecido do
      # arborist (TypeError: Cannot read properties of null (reading 'edgesOut')) ao
      # resolver o grafo de peer dependencies deste package.json, e falha mesmo com
      # `npm ci` sobre lockfile já válido. Reproduzido e corrigido nesta sessão; ver
      # package-lock.json regenerado com npm 12.2.2. Versão testada e com `npm ci` limpo.
      - name: Fixar npm (evita bug do arborist na resolução de peer deps)
        run: npm install -g npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Application
        run: npm run build

  e2e-tests:
    name: Playwright E2E (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [preview, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # Mesmo pin do job acima — ver comentário lá.
      - name: Fixar npm (evita bug do arborist na resolução de peer deps)
        run: npm install -g npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (preview / dev server)
        if: matrix.target == 'preview'
        run: npm run test:e2e
        env:
          CI: "true"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run Playwright tests (production build)
        if: matrix.target == 'build'
        run: npm run test:e2e:build
        env:
          CI: "true"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.target }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright failure artifacts (screenshots, videos, traces)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures-${{ matrix.target }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
