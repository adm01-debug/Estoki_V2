name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}

  e2e-tests:
    name: Playwright E2E (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Sem teto, um E2E travado prendia a fila por ate 6h (default do GitHub) e
    # bloqueava os runs seguintes. O normal medido e 21-26 min por run completo.
    timeout-minutes: 30
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (production build)
        run: npm run test:e2e:build
        timeout-minutes: 20
        env:
          CI: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.target }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright failure artifacts (screenshots, videos, traces)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures-${{ matrix.target }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
