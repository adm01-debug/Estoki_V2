# docs:
#   gatilho: workflow_dispatch - nunca push, nunca cron
#   prova: depois de definir, use "Diagnostico de producao" com alvo=edges para conferir os nomes
#          e o CORS ao vivo (origem permitida refletida, origem de terceiro recusada)
#   porque: sem WEBAUTHN_ORIGINS o resolveRp cai para o header Origin do cliente (conferencia no-op);
#           sem APP_ORIGINS a resposta CORS devolve o dominio antigo e o navegador bloqueia a edge
#   falha: sem token, confirmacao diferente de DEFINIR, origem invalida, HTTP != 200
#   rollback: rode de novo com a lista anterior; as chaves nao enviadas ficam intactas
#   nao-e-bug: o endpoint so altera os nomes enviados, os outros secrets do projeto nao sao tocados
name: Env das edge functions em producao

on:
  workflow_dispatch:
    inputs:
      origens:
        description: "origens permitidas, separadas por virgula (ex. https://estoki.app,https://estoki-v2.vercel.app)"
        type: string
        required: true
      rp_id:
        description: "WEBAUTHN_RP_ID (opcional; vazio usa o hostname da origem permitida)"
        type: string
        default: ""
      confirmacao:
        description: "escreva DEFINIR para autorizar a escrita no projeto oficial"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: edges-env
  cancel-in-progress: false

jobs:
  definir:
    name: Definir env das edges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SB_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'ookjbflsnoefnsixrspc' }}
      ORIGENS_ALVO: ${{ inputs.origens }}
      RP_ID_ALVO: ${{ inputs.rp_id }}
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Conferir autorizacao
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::sem SUPABASE_MANAGEMENT_TOKEN/SUPABASE_ACCESS_TOKEN: nao da para escrever no projeto oficial"
            exit 1
          fi
          if [ "$CONFIRMACAO" != "DEFINIR" ]; then
            echo "::error::escreva DEFINIR no campo confirmacao para autorizar a escrita"
            exit 1
          fi
          if [ -z "${ORIGENS_ALVO:-}" ]; then
            echo "::error::origens vazias"
            exit 1
          fi
      - name: Validar e definir
        run: bash scripts/edge/definir-env.sh
