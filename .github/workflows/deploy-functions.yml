# docs:
#   gatilho: workflow_dispatch (slugs vazio = as 26 edges com guarda de sessao de _shared/auth.ts).
#   prova: depois do deploy cada slug recusa a chave publica do site com 401 {"error":"sessao obrigatoria"}
#          (a resposta tem de ser a guarda, nao o "Invalid API key" da plataforma).
#   rollback: o artefato rollback-edges-<sha> guarda o index.ts anterior de cada slug; para voltar,
#             copie o corpo para supabase/functions/<slug>/index.ts em uma branch fix: e rode este
#             workflow de novo com o slug.
#   falha: sem token, slug sem pasta local, deploy recusado pela API ou funcao que nao responda a guarda.
# nao-e-bug:
#   - sem-token: avisa e sai verde sem tocar no projeto oficial
#   - backup parcial: funcao que a API nao devolve corpo fica sem backup, o log avisa e o deploy segue
#   - verify_jwt: nao e a defesa (a chave publica passa por ele); a defesa e a guarda no codigo
name: Deploy edge functions em producao

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "slugs separados por virgula; vazio = as 22 com guarda de sessao"
        type: string
        default: ""
      confirmacao:
        description: "escreva IMPLANTAR para autorizar deploy no projeto oficial"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy das edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REF: ookjbflsnoefnsixrspc
      ALVO_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ookjbflsnoefnsixrspc.supabase.co' }}
      CHAVE_PUBLICA: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lBoxcGwOv0lccSjiahKbng_0XD1m9RO' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Conferir autorizacao
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::sem SUPABASE_MANAGEMENT_TOKEN/SUPABASE_ACCESS_TOKEN: nada foi implantado."
            echo "SEM_TOKEN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${CONFIRMACAO}" != "IMPLANTAR" ]; then
            echo "::error::deploy no projeto oficial exige confirmacao = IMPLANTAR"
            exit 1
          fi
      - name: Definir slugs
        if: env.SEM_TOKEN != '1'
        env:
          PEDIDOS: ${{ inputs.slugs }}
        run: |
          set -euo pipefail
          PADRAO="abc-analysis ai-assistant alert-expiration alerta-divergencia-fornecedor analytics calculate-kpis carrier-track check-reorder dashboard-stats export-data gerar-desafios-diarios health-check integration-amazon integration-ifood integration-mercado-livre integration-rappi integration-sap integration-totvs nfe-import previsao-demanda produtos-sync reorder-check safety-stock scanner-ocr send-email-alert stock-alert"
          if [ -z "${PEDIDOS// /}" ]; then
            SLUGS="$PADRAO"
          else
            SLUGS=$(echo "${PEDIDOS//,/ }" | tr -s ' ')
          fi
          for s in $SLUGS; do
            if [ ! -f "supabase/functions/$s/index.ts" ]; then
              echo "::error::sem fonte local para $s"
              exit 1
            fi
          done
          echo "slugs: $(echo "$SLUGS" | wc -w)"
          echo "SLUGS=$SLUGS" >> "$GITHUB_ENV"
      - name: Backup dos corpos atuais (rollback)
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          mkdir -p rollback
          curl -sS -f -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$REF/functions" -o rollback/funcoes.json \
            || echo "::warning::nao foi possivel listar as funcoes do projeto"
          for s in $SLUGS; do
            if curl -sS -f -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$REF/functions/$s/body" -o "rollback/$s.ts"; then
              echo "backup: $s ($(wc -c < "rollback/$s.ts") bytes)"
            else
              rm -f "rollback/$s.ts"
              echo "::warning::sem corpo salvo de $s"
            fi
          done
      - name: Guardar artefato de rollback
        if: env.SEM_TOKEN != '1'
        uses: actions/upload-artifact@v7
        with:
          name: rollback-edges-${{ github.sha }}
          path: rollback
          retention-days: 30
          if-no-files-found: warn
      - name: Deploy das funcoes
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          for s in $SLUGS; do
            echo "== $s"
            npx --yes supabase@3.1.0 functions deploy "$s" --project-ref "$REF" --use-api --yes
          done
      - name: Provar que a chave publica nao executa mais
        if: env.SEM_TOKEN != '1'
        run: |
          set -euo pipefail
          FALHA=0
          for s in $SLUGS; do
            corpo=$(mktemp)
            codigo=$(curl -sS -o "$corpo" -w "%{http_code}" -X POST "$ALVO_URL/functions/v1/$s" \
              -H "apikey: $CHAVE_PUBLICA" -H "Authorization: Bearer $CHAVE_PUBLICA" \
              -H "Content-Type: application/json" -d '{}')
            # guardas conhecidas: _shared/auth.ts responde 401 "sessao obrigatoria";
            # backend-health responde 403 "Invalid session". As duas recusam a chave publica.
            if { [ "$codigo" = "401" ] || [ "$codigo" = "403" ]; } && grep -qiE "sessao obrigatoria|invalid session" "$corpo"; then
              echo "ok: $s -> $codigo guarda"
            else
              echo "::error::$s respondeu $codigo sem a guarda: $(head -c 200 "$corpo")"
              FALHA=1
            fi
            rm -f "$corpo"
          done
          exit $FALHA
