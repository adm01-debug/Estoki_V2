# docs:
#   gatilho: cron semanal (segunda 10:23 UTC) e workflow_dispatch
#   prova: inventario/estado/{rotas,edges,banco}.json refletem o codigo e o banco de hoje
#   falha: gerador quebrado, resposta que nao prova ser do banco oficial, ou PR que nao abriu
#   avisa: notifica-falha-main.yml abre issue
# nao-e-bug:
#   - banco-sem-token: sem SUPABASE_ACCESS_TOKEN o inventario do banco e pulado (rotas e edges seguem)
#   - sem-pr: se nada estrutural mudou, mudou-conteudo.mjs diz `false` e nenhuma PR e aberta
name: Inventario do estado real (semanal)

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

concurrency:
  group: inventario-estado
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gerar:
    name: Gerar e propor
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: ripgrep (o inventario de edges falha fechado sem ele)
        run: command -v rg >/dev/null || sudo apt-get install -y ripgrep

      - name: Inventario do banco
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente: inventario/estado/banco.json nao foi medido."
            exit 0
          fi
          node scripts/inventario/gerar-banco.mjs

      - name: Inventario de rotas e telas
        run: node scripts/inventario/gerar-rotas.mjs

      - name: Inventario de edge functions
        run: node scripts/inventario/gerar-repo.mjs < /dev/null

      - name: Mudou algo estrutural?
        id: mudou
        run: echo "mudou=$(node scripts/inventario/mudou-conteudo.mjs)" >> "$GITHUB_OUTPUT"

      - name: Abrir PR com o inventario novo
        id: pr
        if: steps.mudou.outputs.mudou == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          base: main
          branch: automation/inventario-estado
          delete-branch: true
          commit-message: "chore(estado): atualiza inventario do estado real"
          title: "chore(estado): inventario do estado real"
          labels: inventario
          # Banco nao entra no glob: sem SUPABASE_ACCESS_TOKEN o gerador pula o
          # banco.json (ver topo do arquivo) e o add-paths literal quebrava com
          # 'pathspec did not match'. O glob so paga o que existe e o .gitignore
          # (.gitignore contem /inventario/estado/tabelas-uso.json) nao deixa arquivo solto
          # entrar na PR.
          add-paths: |
            inventario/estado/*.json
          body: |
            Gerado por `inventario-estado.yml`. Nada escrito a mao: `scripts/inventario/*` lendo o
            codigo e o banco (somente leitura). Detalhe de cada arquivo em
            `inventario/estado/README.md`.

            Esta PR so existe porque `scripts/inventario/mudou-conteudo.mjs` achou mudanca
            estrutural: carimbo de data e telemetria de janela rolante sao ignorados.

      - name: Destravar os checks da PR automatica
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@v9
        with:
          script: |
            // PR aberta com GITHUB_TOKEN nao dispara workflow (anti-loop): os checks nascem
            // em action_required e precisam ser aprovados aqui.
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: 'automation/inventario-estado', status: 'action_required', per_page: 20,
            });
            for (const run of runs.data.workflow_runs) {
              try { await github.rest.actions.approveWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id }); }
              catch (erro) { core.warning(`run ${run.id}: ${erro.message}`); }
            }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inventario-estado
          path: inventario/estado
          retention-days: 14
