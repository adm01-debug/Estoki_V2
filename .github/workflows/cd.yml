name: CD - Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & artifact
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - run: npx size-limit
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  deploy_staging:
    name: Deploy to Vercel (staging preview)
    needs: build
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://estoki-v2.vercel.app
    steps:
      - uses: actions/checkout@v7
      - name: Deploy preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npx vercel deploy --token "$VERCEL_TOKEN" --yes \
            --scope juca1 > /tmp/vercel.out 2>&1
          cat /tmp/vercel.out
      - name: Smoke test staging
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://estoki-v2.vercel.app/ || echo "000")
          echo "staging http_code=$code"
          if [ "$code" = "200" ]; then echo "OK: estoki-v2.vercel.app up"; else echo "WARN: dominio nao respondeu 200"; fi

  deploy_production:
    name: Deploy to Vercel (production)
    needs: build
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://estoki-v2.vercel.app
    steps:
      - uses: actions/checkout@v7
      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes > /tmp/vercel.out 2>&1
          cat /tmp/vercel.out
      - name: Smoke test production
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://estoki-v2.vercel.app/ || echo "000")
          echo "production http_code=$code"
          if [ "$code" != "200" ]; then echo "FATAL: producao nao responde 200"; exit 1; fi
      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" --generate-notes --target "$GITHUB_SHA" || true
