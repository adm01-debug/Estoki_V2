# Sonda temporaria: le o schema do banco oficial e imprime. Removida antes do merge da PR.
name: tmp sonda schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Consulta somente leitura
        env:
          TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const url = "https://api.supabase.com/v1/projects/ookjbflsnoefnsixrspc/database/query/read-only";
            const res = await fetch(url, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query: fs.readFileSync("scripts/inventario/tmp-sonda.sql", "utf8") }),
            });
            if (!res.ok) { console.log("HTTP " + res.status); process.exit(1); }
            const corpo = await res.json();
            const linha = Array.isArray(corpo) ? corpo[0] : corpo;
            console.log("SONDA " + JSON.stringify(linha).slice(0, 8000));
          '