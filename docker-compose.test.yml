version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run test:coverage
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - CI=true

  e2e-runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run test:e2e
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=test
